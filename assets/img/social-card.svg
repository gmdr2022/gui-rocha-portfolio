<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Guilherme Rocha — Product Owner e criador de produtos digitais</title>
  <desc id="desc">Cartão social do portfólio, com identidade em azul oceânico e verde sálvia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101b"/><stop offset=".58" stop-color="#0a2235"/><stop offset="1" stop-color="#12364e"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop stop-color="#38b7d9" stop-opacity=".35"/><stop offset="1" stop-color="#38b7d9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#d9edf7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/><rect width="1200" height="630" fill="url(#glow)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(72 64)"><rect width="72" height="72" rx="22" fill="#b7f269"/><text x="36" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" fill="#061927">GR</text><text x="96" y="31" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#f2f7fa">Guilherme Rocha</text><text x="96" y="59" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.6" fill="#82d7ff">PRODUCT OWNER · PRODUTOS DIGITAIS</text></g>
  <text x="72" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="720" letter-spacing="-3.8" fill="#f2f7fa">Começo pelo problema</text>
  <text x="72" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="720" letter-spacing="-3.8" fill="#f2f7fa">e acompanho cada etapa</text>
  <text x="72" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="720" letter-spacing="-3.8" fill="#82d7ff">até a entrega.</text>
  <line x1="72" y1="492" x2="1128" y2="492" stroke="#82d7ff" stroke-opacity=".32"/>
  <circle cx="80" cy="548" r="8" fill="#b7f269"/><text x="104" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#c4d3dc">Direção de produto · construção digital · aplicação prática</text>
</svg>
