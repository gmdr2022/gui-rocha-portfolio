<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Composição de sites publicados em telas sobrepostas</title>
  <desc id="description">Capturas reais de Demonyza e ClubAL organizadas em janelas de navegador e uma tela móvel, sobre um fundo escuro com luz suave.</desc>
  <defs>
    <linearGradient id="backdrop" x1="120" y1="40" x2="1480" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061923"/>
      <stop offset=".52" stop-color="#0a2730"/>
      <stop offset="1" stop-color="#13262c"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(1300 120) rotate(134) scale(720 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76d8d0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#76d8d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(160 820) rotate(-34) scale(700 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8658c8" stop-opacity=".23"/>
      <stop offset="1" stop-color="#8658c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#b8f5ed" stop-opacity=".035"/>
    </linearGradient>
    <linearGradient id="phone-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".36" stop-color="#061a20" stop-opacity="0"/>
      <stop offset=".63" stop-color="#061a20" stop-opacity=".82"/>
      <stop offset="1" stop-color="#061a20" stop-opacity=".97"/>
    </linearGradient>
    <clipPath id="demonyza-clip">
      <rect x="105" y="170" width="875" height="530" rx="22"/>
    </clipPath>
    <clipPath id="clubal-clip">
      <rect x="580" y="365" width="915" height="502" rx="22"/>
    </clipPath>
    <clipPath id="mobile-clip">
      <rect x="1251" y="132" width="250" height="522" rx="36"/>
    </clipPath>
    <filter id="window-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#02070b" flood-opacity=".56"/>
    </filter>
    <filter id="phone-shadow" x="-40%" y="-30%" width="180%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#02070b" flood-opacity=".65"/>
    </filter>
    <filter id="mobile-soften" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#backdrop)"/>
  <rect width="1600" height="1000" fill="url(#cyan-glow)"/>
  <rect width="1600" height="1000" fill="url(#violet-glow)"/>
  <path d="M0 755C265 686 408 769 636 706c249-69 370-243 630-264 117-9 228 18 334 69v489H0V755Z" fill="#d8fff4" fill-opacity=".025"/>
  <path d="M34 892c251-66 485 10 677-64 177-68 311-219 533-254 130-20 245-2 334 40" fill="none" stroke="#a9eee4" stroke-opacity=".12" stroke-width="2"/>

  <g filter="url(#window-shadow)">
    <rect x="72" y="92" width="942" height="642" rx="36" fill="#07131c"/>
    <rect x="73" y="93" width="940" height="640" rx="35" fill="url(#glass)" stroke="#c9fff6" stroke-opacity=".25" stroke-width="2"/>
    <path d="M73 140c0-26 21-47 47-47h846c26 0 47 21 47 47v30H73v-30Z" fill="#0e2029" fill-opacity=".94"/>
    <circle cx="113" cy="132" r="7" fill="#f0a675"/>
    <circle cx="137" cy="132" r="7" fill="#e5ca72"/>
    <circle cx="161" cy="132" r="7" fill="#66c8a3"/>
    <rect x="203" y="119" width="392" height="27" rx="13.5" fill="#d9fff8" fill-opacity=".075"/>
    <image href="../demonyza/home.webp" x="105" y="170" width="875" height="530" preserveAspectRatio="xMidYMid slice" clip-path="url(#demonyza-clip)"/>
    <rect x="105" y="170" width="875" height="530" rx="22" fill="none" stroke="#d9fff8" stroke-opacity=".12"/>
  </g>

  <g filter="url(#window-shadow)">
    <rect x="546" y="286" width="983" height="616" rx="38" fill="#07171d"/>
    <rect x="547" y="287" width="981" height="614" rx="37" fill="url(#glass)" stroke="#b8f6ed" stroke-opacity=".31" stroke-width="2"/>
    <path d="M547 334c0-26 21-47 47-47h887c26 0 47 21 47 47v31H547v-31Z" fill="#10272b" fill-opacity=".96"/>
    <circle cx="590" cy="326" r="7" fill="#f0a675"/>
    <circle cx="614" cy="326" r="7" fill="#e5ca72"/>
    <circle cx="638" cy="326" r="7" fill="#66c8a3"/>
    <rect x="682" y="313" width="430" height="27" rx="13.5" fill="#d9fff8" fill-opacity=".075"/>
    <image href="clubal-site-dark-1600x1000.png" x="-188" y="155" width="1683" height="1050" preserveAspectRatio="none" clip-path="url(#clubal-clip)"/>
    <rect x="580" y="365" width="915" height="502" rx="22" fill="none" stroke="#c8fff4" stroke-opacity=".13"/>
  </g>

  <g filter="url(#phone-shadow)">
    <rect x="1228" y="106" width="296" height="574" rx="54" fill="#050b10"/>
    <rect x="1229" y="107" width="294" height="572" rx="53" fill="url(#glass)" stroke="#d8fff8" stroke-opacity=".33" stroke-width="2"/>
    <image href="clubal-site-mobile-390x844.png" x="1251" y="132" width="250" height="522" preserveAspectRatio="xMidYMid slice" clip-path="url(#mobile-clip)" filter="url(#mobile-soften)"/>
    <rect x="1251" y="132" width="250" height="522" rx="36" fill="#061a20" fill-opacity=".16"/>
    <rect x="1251" y="132" width="250" height="522" rx="36" fill="url(#phone-fade)"/>
    <rect x="1327" y="118" width="98" height="10" rx="5" fill="#060c10"/>
    <rect x="1251" y="132" width="250" height="522" rx="36" fill="none" stroke="#d8fff8" stroke-opacity=".18"/>
  </g>

  <g opacity=".75">
    <circle cx="117" cy="830" r="5" fill="#82ddd2"/>
    <path d="M141 830h188" stroke="#82ddd2" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <path d="M141 848h116" stroke="#e7fff9" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
