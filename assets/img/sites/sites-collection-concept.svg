    <rect x="606" y="130" width="282" height="382" rx="30" fill="#11213d"/>
    <rect x="638" y="164" width="218" height="98" rx="22" fill="url(#blue)"/>
    <rect x="638" y="288" width="92" height="188" rx="20" fill="#223b69"/>
