<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Composição conceitual de sites responsivos</title>
  <description id="description">Três interfaces abstratas e um celular representam diferentes identidades visuais e layouts responsivos. Nenhuma tela representa um cliente real.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071512"/>
      <stop offset=".52" stop-color="#102b27"/>
      <stop offset="1" stop-color="#11213d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86b8ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c8ff71"/>
      <stop offset="1" stop-color="#3bd8b0"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb77d"/>
      <stop offset="1" stop-color="#ef6d78"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#d9fff5" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" rx="72" fill="url(#background)"/>
  <rect width="1600" height="1000" rx="72" fill="url(#grid)"/>
  <circle cx="190" cy="130" r="250" fill="#a9ed34" opacity=".12"/>
  <circle cx="1420" cy="870" r="340" fill="#4f8cff" opacity=".18"/>

