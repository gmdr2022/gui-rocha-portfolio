<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">C7 Engineering System</title>
  <desc id="description">Diagrama abstrato de sete lentes conectadas a um núcleo local de engenharia com validação e rollback.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#173b34"/>
      <stop offset="0.6" stop-color="#0b201d"/>
      <stop offset="1" stop-color="#06110f"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8ff84"/>
      <stop offset="1" stop-color="#58d7b5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#background)"/>
  <g fill="none" stroke="#7be4c1" stroke-opacity=".28" stroke-width="4">
    <path d="M800 500 800 145M800 500 1077 279M800 500 1145 579M800 500 954 820M800 500 646 820M800 500 455 579M800 500 523 279"/>
    <circle cx="800" cy="500" r="300" stroke-dasharray="9 18"/>
    <circle cx="800" cy="500" r="390" stroke-opacity=".12"/>
  </g>
  <g fill="#102b26" stroke="#8ce8c9" stroke-width="4">
    <circle cx="800" cy="145" r="54"/>
    <circle cx="1077" cy="279" r="54"/>
    <circle cx="1145" cy="579" r="54"/>
    <circle cx="954" cy="820" r="54"/>
    <circle cx="646" cy="820" r="54"/>
    <circle cx="455" cy="579" r="54"/>
    <circle cx="523" cy="279" r="54"/>
  </g>
  <g fill="#d9fff0" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <text x="800" y="153">K</text>
    <text x="1077" y="287">T</text>
    <text x="1145" y="587">M</text>
    <text x="954" y="828">A</text>
    <text x="646" y="828">P</text>
    <text x="455" y="587">R</text>
    <text x="523" y="287">S</text>
  </g>
  <circle cx="800" cy="500" r="172" fill="#0b1d1a" stroke="url(#core)" stroke-width="8" filter="url(#glow)"/>
  <text x="800" y="480" fill="url(#core)" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" text-anchor="middle">C7</text>
  <text x="800" y="548" fill="#dffcf2" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="7" text-anchor="middle">ENGINEERING</text>
  <g transform="translate(1190 770)">
    <rect width="250" height="104" rx="28" fill="#102b26" stroke="#8ce8c9" stroke-width="3"/>
    <path d="m42 55 18 18 38-43" fill="none" stroke="#b8ff62" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"/>
    <text x="120" y="50" fill="#dffcf2" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">VALIDADO</text>
    <text x="120" y="77" fill="#9bc7b9" font-family="Segoe UI, Arial, sans-serif" font-size="17">rollback pronto</text>
  </g>
  <text x="94" y="876" fill="#9bc7b9" font-family="Segoe UI, Arial, sans-serif" font-size="25">LOCAL · PROGRESSIVO · REVERSÍVEL</text>
</svg>
